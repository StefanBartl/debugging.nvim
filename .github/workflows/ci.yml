name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  # Gating: stylua + luacheck must pass.
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: stylua (check)
        uses: JohnnyMorganz/stylua-action@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          version: v2.5.2
          args: --check lua plugin TESTS

      - name: Install luacheck
        run: sudo apt-get update && sudo apt-get install -y luarocks && sudo luarocks install luacheck 1.2.0

      - name: luacheck
        run: luacheck lua plugin TESTS

  # Real gate: the framework-free headless suite (config merge, the
  # `autocmds sources` parsers, :Debug dispatch/completion, startup benchmark).
  # lib.nvim is checked out as a sibling and put on the runtimepath — it is a
  # deliberate hard dependency (notify, window, usercmd.composer, fs, cache).
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      # One platform failing must not cancel the others: which of the three
      # broke is the whole information content of this job.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    defaults:
      run:
        # Windows runners default to PowerShell; one shell on all three keeps
        # the run step itself from being what differs between platforms.
        shell: bash
    steps:
      - name: Checkout debugging.nvim
        uses: actions/checkout@v5
        with:
          path: debugging.nvim

      - name: Checkout lib.nvim
        uses: actions/checkout@v5
        with:
          repository: StefanBartl/lib.nvim
          path: lib.nvim
          ref: ci-verified

      - name: Install Neovim (stable)
        uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: stable

      # Checked out from the branch that only moves once the dependency's own CI is green.
      - uses: actions/checkout@v5
        with:
          repository: "StefanBartl/testing.nvim"
          path: testing.nvim
          ref: ci-verified
      - name: Run tests
        working-directory: debugging.nvim
        env:
          REPOS_DIR: ${{ github.workspace }}
        run: |
          exec > >(tee -a "$RUNNER_TEMP/test-output.log") 2>&1
          bash scripts/test.sh --json "$RUNNER_TEMP/testing-ir.json"
      - name: Conformance gate
        working-directory: debugging.nvim
        env:
          REPOS_DIR: ${{ github.workspace }}
        run: bash scripts/test.sh conformance
      # The IR of the Linux run carries the surface the specs exercised: the baseline (surface.baseline.json) is
      # written from exactly this artifact, so it matches what the runner measures.
      - uses: actions/upload-artifact@v7
        if: matrix.os == 'ubuntu-latest' && always()
        with:
          name: surface-ir
          path: ${{ runner.temp }}/testing-ir.json
          if-no-files-found: ignore
          retention-days: 7
      # Regression gate for the surface (docs/SURFACE.md of testing.nvim): a command, keymap or autocommand that the specs
      # exercised when surface.baseline.json was written must still be exercised. Linux only: the baseline comes from
      # the Linux run. To accept an intended change, rewrite the file from a green Linux run (`scripts/test.sh surface
      # --from <ir> --write-baseline surface.baseline.json`, IR = the surface-ir artifact) and review the diff.
      - name: Surface baseline gate
        if: matrix.os == 'ubuntu-latest'
        working-directory: debugging.nvim
        env:
          REPOS_DIR: ${{ github.workspace }}
        run: bash scripts/test.sh surface --from "$RUNNER_TEMP/testing-ir.json" --baseline surface.baseline.json --require-signed-baseline
      # The IR is what a reporter or a person reads to find out WHICH case failed on WHICH platform.
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: testing-ir-${{ matrix.os }}
          path: ${{ runner.temp }}/testing-ir.json
          if-no-files-found: ignore
          retention-days: 14
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: test-output-test-${{ matrix.os }}
          path: ${{ runner.temp }}/test-output.log
          if-no-files-found: ignore
          retention-days: 14
